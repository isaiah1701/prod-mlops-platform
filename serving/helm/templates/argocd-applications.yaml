{{- if .Values.bootstrap.enabled }}
{{- $repoURL := required "git.repoURL is required" .Values.git.repoURL }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.project.name }}
  namespace: {{ .Release.Namespace }}
spec:
  description: Airbnb model-serving controllers, secrets, and workload.
  sourceRepos:
    - {{ $repoURL }}
    - {{ .Values.externalSecretsOperator.chartRepo }}
  destinations:
    - namespace: {{ .Values.externalSecretsOperator.namespace }}
      server: {{ .Values.destination.server }}
    - namespace: {{ .Values.destination.namespace }}
      server: {{ .Values.destination.server }}
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.externalSecretsOperator.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project.name }}
  source:
    repoURL: {{ .Values.externalSecretsOperator.chartRepo }}
    chart: {{ .Values.externalSecretsOperator.chart }}
    targetRevision: {{ .Values.externalSecretsOperator.chartVersion | quote }}
    helm:
      releaseName: {{ .Values.externalSecretsOperator.name }}
      valuesObject:
        installCRDs: true
        serviceAccount:
          create: true
          name: {{ .Values.externalSecretsOperator.serviceAccountName }}
  destination:
    server: {{ .Values.destination.server }}
    namespace: {{ .Values.externalSecretsOperator.namespace }}
  syncPolicy:
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
    {{- if .Values.syncPolicy.automated }}
    automated:
      prune: {{ .Values.syncPolicy.prune }}
      selfHeal: {{ .Values.syncPolicy.selfHeal }}
    {{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airbnb-inference-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project.name }}
  source:
    repoURL: {{ $repoURL }}
    targetRevision: {{ .Values.git.targetRevision }}
    path: {{ .Values.git.chartPath }}
    helm:
      releaseName: airbnb-inference-secrets
      valueFiles: ["values/base.yaml", "values/production.yaml"]
      valuesObject:
        bootstrap:
          enabled: false
        workload:
          enabled: false
  destination:
    server: {{ .Values.destination.server }}
    namespace: {{ .Values.destination.namespace }}
  syncPolicy:
    syncOptions: ["CreateNamespace=true"]
    {{- if .Values.syncPolicy.automated }}
    automated:
      prune: {{ .Values.syncPolicy.prune }}
      selfHeal: {{ .Values.syncPolicy.selfHeal }}
    {{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airbnb-inference
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project.name }}
  source:
    repoURL: {{ $repoURL }}
    targetRevision: {{ .Values.git.targetRevision }}
    path: {{ .Values.git.chartPath }}
    helm:
      releaseName: airbnb-inference
      valueFiles: ["values/base.yaml", "values/production.yaml"]
      valuesObject:
        bootstrap:
          enabled: false
        externalSecret:
          enabled: false
  destination:
    server: {{ .Values.destination.server }}
    namespace: {{ .Values.destination.namespace }}
  syncPolicy:
    syncOptions: ["CreateNamespace=true"]
    {{- if .Values.syncPolicy.automated }}
    automated:
      prune: {{ .Values.syncPolicy.prune }}
      selfHeal: {{ .Values.syncPolicy.selfHeal }}
    {{- end }}
{{- end }}
