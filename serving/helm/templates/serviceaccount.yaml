{{- if and .Values.workload.enabled (not .Values.bootstrap.enabled) .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "airbnb.serviceAccountName" . }}
  labels:
    {{- include "airbnb.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
